<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat – lokaler Klon</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#f4f4f4;background:#212121;color-scheme:dark}*{box-sizing:border-box}body{margin:0}main{height:100dvh;display:flex;flex-direction:column}.conversation{flex:1;overflow:auto;padding:40px 24px 20px}.messages{max-width:760px;margin:auto;display:flex;flex-direction:column;gap:26px}.message{line-height:1.65;font-size:16px;white-space:pre-wrap;overflow-wrap:anywhere}.message.user{align-self:flex-end;max-width:80%;background:#f4f4f4;padding:10px 18px;border-radius:24px}.message.assistant{align-self:stretch;padding:2px 0 8px;line-height:1.75}.thinking{display:flex;align-items:center;gap:9px;color:#777;font-size:14px;animation:appear .25s ease}.thinking .spark{font-size:19px;animation:breathe 1.1s ease-in-out infinite}.thinking .word{animation:breathe 1.1s ease-in-out infinite}@keyframes breathe{0%,100%{opacity:.45;transform:scale(.97)}50%{opacity:1;transform:scale(1.04)}}@keyframes appear{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}.welcome{margin:auto;text-align:center;font-size:30px;font-weight:600;letter-spacing:-.7px}.composer-wrap{width:min(800px,calc(100% - 32px));margin:0 auto;padding-bottom:12px}.composer{border:1px solid #e6e6e6;border-radius:26px;box-shadow:0 3px 15px #0000000a;padding:14px 14px 10px;background:#fff}textarea{border:0;outline:0;resize:none;display:block;width:100%;min-height:35px;max-height:180px;font:16px/1.5 inherit;font-family:inherit;padding:2px 6px;background:transparent}.tools{display:flex;align-items:center;gap:8px;margin-top:8px}button{border:0;cursor:pointer;background:transparent;color:inherit}button.circle{width:34px;height:34px;border-radius:50%;font-size:24px;display:grid;place-items:center}button.circle:hover{background:#f2f2f2}.send{margin-left:auto;background:#171717!important;color:white!important;font-size:19px!important}.send:disabled{background:#e5e5e5!important;color:#aaa!important}.menu{position:absolute;bottom:110px;background:white;border:1px solid #eee;border-radius:14px;padding:8px;box-shadow:0 4px 25px #0002;display:none}.menu.open{display:block}.menu button{display:block;padding:10px;text-align:left;width:100%}.menu button:hover{background:#f5f5f5}@media(max-width:600px){.conversation{padding:24px 16px}.welcome{font-size:24px}.composer-wrap{width:calc(100% - 20px)}} body.dark{background:#212121;color:#f4f4f4}body.dark .composer{background:#303030;border-color:#424242;box-shadow:none}body.dark textarea{color:#f4f4f4}body.dark textarea::placeholder{color:#aaa}body.dark .message.user{background:#303030}body.dark .thinking{color:#aaa}body.dark button.circle:hover{background:#424242}body.dark .send{background:#f4f4f4!important;color:#202020!important}body.dark .send:disabled{background:#484848!important;color:#999!important}body.dark .menu{background:#303030;border-color:#484848}body.dark .menu button:hover{background:#424242}@media(prefers-reduced-motion:reduce){.thinking,.thinking .spark,.thinking .word{animation:none!important}} /* Embedded dashboard: preserve chat appearance while fitting narrow panel. */
