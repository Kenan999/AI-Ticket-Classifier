const input=document.getElementById('input'),send=document.getElementById('send'),messages=document.getElementById('messages'),scroll=document.getElementById('scroll');let history=JSON.parse(localStorage.getItem('localChatHistory')||'[]');let normalChatGeneration=0;window.ChatCloneCancelPendingReplies=()=>{normalChatGeneration++};function draw(){messages.innerHTML='';if(!history.length){messages.innerHTML='<div class="welcome">How can I help you?</div>';return}for(const m of history){let d=document.createElement('div');d.className='message '+m.role;d.textContent=m.text;messages.append(d)}scroll.scrollTop=scroll.scrollHeight}draw();input.addEventListener('input',()=>{send.disabled=!input.value.trim();input.style.height='35px';input.style.height=Math.min(input.scrollHeight,180)+'px'});input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.getElementById('form').requestSubmit()}});document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();let text=input.value.trim();if(!text)return;if(window.ChatCloneIsSupportActive?.()){try{await window.ChatCloneSendSupportMessage(text);input.value='';input.dispatchEvent(new Event('input'));}catch(err){console.error(err)}return;}if(window.ChatCloneHandleScenarioMessage?.(text)){input.value='';input.style.height='35px';send.disabled=true;return}history.push({role:'user',text});localStorage.setItem('localChatHistory',JSON.stringify(history));input.value='';input.style.height='35px';send.disabled=true;draw();const thinking=document.createElement('div');thinking.className='thinking';thinking.innerHTML='<span class="spark">✦</span><span class="word">Thinking…</span>';messages.append(thinking);scroll.scrollTop=scroll.scrollHeight;const replyGeneration=normalChatGeneration;(async()=>{let answer;try{const result=await window.ChatCloneAskGemini(text);answer=window.ChatCloneCleanAssistantText?.(result.answer)||result.answer;}catch(error){console.error('Chat API failed',error);answer='The AI service is temporarily unavailable. Please try again.';}if(replyGeneration!==normalChatGeneration)return;thinking.remove();history.push({role:'assistant',text:answer});localStorage.setItem('localChatHistory',JSON.stringify(history));draw();const lastReply=messages.querySelector('.message.assistant:last-child');if(lastReply&&window.ChatCloneReveal)window.ChatCloneReveal(lastReply,answer)})()});document.getElementById('plus').onclick=()=>document.getElementById('menu').classList.toggle('open');document.getElementById('attach').onclick=()=>document.getElementById('file').click();document.getElementById('file').onchange=e=>{let f=e.target.files[0];if(f){input.value+=(input.value?' ':'')+'[File: '+f.name+']';input.dispatchEvent(new Event('input'))}document.getElementById('menu').classList.remove('open')};document.getElementById('clear').onclick=()=>{if(confirm('Clear local chat history?')){history=[];localStorage.removeItem('localChatHistory');window.ChatCloneResetScenario?.();window.ChatCloneResetGeminiSession?.();draw()}document.getElementById('menu').classList.remove('open')};
